<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CORE ZONE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:    #0a0a0a;
      --white: #f0f0f0;
      --dim:   #3a3a3a;
      --mid:   #505050;
      --px:    'Press Start 2P', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: var(--px);
      color: var(--white);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.13) 3px, rgba(0,0,0,0.13) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    body::after {
      content: '';
      position: fixed; left: 0; right: 0;
      height: 140px;
      background: linear-gradient(transparent, rgba(255,255,255,0.013), transparent);
      animation: scandown 9s linear infinite;
      pointer-events: none;
      z-index: 9998;
    }

    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.011) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.011) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* 🔥 INTRO ADDED (ONLY ADDITION) */
    .intro {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      flex-direction: column;
      gap: 20px;
    }

    .intro-text {
      font-size: clamp(10px, 2vw, 22px);
      color: var(--white);
      letter-spacing: 2px;
      animation: flicker 1.2s infinite;
      text-align: center;
    }

    .hide {
      animation: fadeOut 1s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    /* bottom-left controls */
    .ctrl {
      position: fixed;
      bottom: clamp(14px,3vh,34px);
      left: clamp(32px,4vw,56px);
      font-size: clamp(5px,0.75vw,9px);
      color: var(--mid);
      line-height: 2.2;
      letter-spacing: 1px;
      z-index: 2;
    }

    /* bottom-right credit */
    .credit {
      position: fixed;
      bottom: clamp(14px,3vh,34px);
      right: clamp(32px,4vw,56px);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(10px,1.1vw,15px);
      color: var(--mid);
      z-index: 2;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .title {
      font-size: clamp(18px, 3.8vw, 52px);
      color: var(--white);
      text-align: center;
      line-height: 1.75;
      letter-spacing: clamp(2px, 0.5vw, 6px);
      margin-bottom: clamp(40px, 7vh, 90px);
      animation: flicker 11s infinite;
    }

    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2.8vh, 28px);
      margin-bottom: clamp(40px, 7vh, 90px);
    }

    .menu li {
      font-size: clamp(10px, 1.6vw, 20px);
      color: var(--white);
      letter-spacing: clamp(1px, 0.3vw, 3px);
      text-align: center;
      position: relative;
      padding: 0 clamp(28px, 3.5vw, 56px);
      line-height: 1;
    }

    .menu li.active {
      animation: blink-item 0.65s step-end infinite;
    }

    .menu li.active::before {
      content: '>';
      position: absolute; left: 0;
    }

    .menu li.active::after {
      content: '<';
      position: absolute; right: 0;
    }

    .hint {
      font-size: clamp(6px, 0.9vw, 11px);
      color: var(--mid);
      text-align: center;
      letter-spacing: 1px;
      line-height: 1;
    }

    .key {
      display: inline-block;
      border: 1px solid var(--dim);
      padding: 2px 6px 1px;
      border-radius: 2px;
      font-size: inherit;
      font-family: var(--px);
      color: var(--mid);
    }

    @keyframes flicker {
      0%,92%,100% { opacity: 1; }
      93%  { opacity: 0.72; }
      95%  { opacity: 1; }
      97%  { opacity: 0.5; }
      98%  { opacity: 1; }
    }

    @keyframes blink-item {
      0%,49%   { opacity: 1; }
      50%,100% { opacity: 0; }
    }

    @keyframes scandown {
      0%   { top: -140px; }
      100% { top: 100vh; }
    }

    /* flash */
    .flash {
      position: fixed; inset: 0;
      background: var(--white);
      opacity: 0;
      pointer-events: none;
      z-index: 99999;
    }
    .flash.go { animation: flashpop 0.45s steps(2) forwards; }

    @keyframes flashpop {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }
  </style>
</head>

<body>

<!-- 🔥 INTRO ADDED -->
<div class="intro" id="intro">
  <div class="intro-text" id="introText">Developed by GROUP X</div>
</div>

<div class="flash" id="flash"></div>
<div class="grid-bg"></div>

<div class="ctrl">
  ↑ ↓ NAVIGATE<br>
  ENTER LAUNCH<br>
  ESC MENU
</div>

<div class="credit">*Developed by Group X</div>

<div class="stage">

  <h1 class="title">CORE ZONE</h1>

  <ul class="menu" id="menu">
    <li class="active">UDD JETHA UDD</li>
    <li>SNAKE</li>
    <li>CHESS</li>
    <li>CAR CHASE</li>
  </ul>

  <div class="hint" id="hint">
    <p> SELECT GAME TO START </p>
  </div>

</div>

<script>
  const items = document.querySelectorAll('#menu li');
  const hint  = document.getElementById('hint');
  const flash = document.getElementById('flash');
  const intro = document.getElementById('intro');
  const introText = document.getElementById('introText');

  let cur = 0;

  function go(i) {
    if (dotInterval) { clearInterval(dotInterval); dotInterval = null; }
    items[cur].classList.remove('active');
    cur = (i + items.length) % items.length;
    items[cur].classList.add('active');
    hint.innerHTML =
      'PRESS <span class="key">ENTER</span>&nbsp;&nbsp;TO START&nbsp;&nbsp;&nbsp;';
  }

  let dotInterval = null;

  function launch() {
    const name = items[cur].textContent;
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');

    if (dotInterval) clearInterval(dotInterval);
    let dots = 0;
    hint.textContent = '>> LOADING  ' + name + '  ';
    dotInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      hint.textContent = '>> LOADING  ' + name + '  ' + '.'.repeat(dots) || ' ';
    }, 400);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown')  { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowUp')    { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Enter')      { launch(); }
    if (e.key === 'Escape')     { go(0); }
  });

  // 🔥 BOOT ANIMATION
  window.addEventListener('load', () => {

    setTimeout(() => {
      introText.textContent = "Presenting You";
    }, 2000);

    setTimeout(() => {
      intro.classList.add('hide');
    }, 4200);

    setTimeout(() => {
      intro.style.display = 'none';
    }, 5200);

  });
</script>

</body>
</html>
